plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}


def ks = new Properties()
rootProject.file("keystore.properties").withInputStream { ks.load(it) }


android {
    namespace 'com.aikeyboard'
    compileSdk 36

    defaultConfig {
        applicationId "com.drdwarfstudios.ai_keyboard"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.0.0"

        // Emulator -> your laptop. For a real phone see README (adb reverse, or your server's https URL).
        buildConfigField "String", "API_BASE_URL", "\"https://ai-keyboard-3npm.onrender.com/\""
        // OAuth *Web* client ID from Google Cloud (see README). Leave empty to disable Google sign-in.
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"\""
    }

    signingConfigs { release {
        storeFile rootProject.file(ks['storeFile'])
        storePassword ks['storePassword']
        keyAlias ks['keyAlias']; keyPassword ks['keyPassword']
    } }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Google sign-in (Credential Manager)
    implementation 'androidx.credentials:credentials:1.2.2'
    implementation 'androidx.credentials:credentials-play-services-auth:1.2.2'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.0'
}


